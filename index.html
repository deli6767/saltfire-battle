<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saltfire Battle - Mobile Boat Combat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Arial Black', Arial, sans-serif; touch-action: none; }
    #loading { position: fixed; inset: 0; background: linear-gradient(135deg, #001a33, #003366); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 1000; transition: opacity 0.5s; }
    #loading h1 { font-size: 42px; margin-bottom: 10px; text-shadow: 0 0 20px #00aaff; }
    #loading .sub { font-size: 18px; opacity: 0.8; margin-bottom: 30px; }
    #progress-bar { width: 280px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
    #progress { width: 0%; height: 100%; background: linear-gradient(90deg, #00aaff, #00ffaa); transition: width 0.1s; }
    #hud { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    #health { position: absolute; top: 40px; left: 10px; width: 150px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; pointer-events: none; }
    #health-fill { height: 100%; background: #0f0; width: 100%; transition: width 0.2s; }
    #score { position: absolute; top: 10px; right: 10px; color: #ffdd00; font-size: 20px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    #joystick { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border-radius: 50%; pointer-events: auto; touch-action: none; }
    #stick { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; left: 35px; top: 35px; }
    #shoot-btn { position: absolute; bottom: 40px; right: 30px; width: 80px; height: 80px; background: rgba(255,50,50,0.6); border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
    #info { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 12px; pointer-events: none; }
    #game-over { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 500; }
    #game-over h2 { font-size: 48px; color: #ff4444; margin-bottom: 20px; }
    #restart { padding: 15px 30px; font-size: 20px; background: #00aaff; border: none; border-radius: 8px; color: white; cursor: pointer; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="loading"><h1>SALTFIRE BATTLE</h1><div class="sub">Loading water physics & combat systems...</div><div id="progress-bar"><div id="progress"></div></div></div>
  <div id="hud">Speed: 0 KM/H</div>
  <div id="health"><div id="health-fill"></div></div>
  <div id="score">Kills: 0</div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="shoot-btn">FIRE</div>
  <div id="info">Desktop: WASD + Space | Mobile: Stick + FIRE</div>
  <div id="game-over"><h2>WRECKED</h2><p id="final-score">Kills: 0</p><button id="restart">Restart</button></div>
  <script>
    const loadingEl = document.getElementById('loading');
    const progressEl = document.getElementById('progress');
    let progress = 0;
    const loadInterval = setInterval(() => { progress += Math.random() * 12; if (progress > 95) progress = 95; progressEl.style.width = progress + '%'; }, 150);
    function hideLoading() { clearInterval(loadInterval); progressEl.style.width = '100%'; setTimeout(() => { loadingEl.style.opacity = '0'; setTimeout(() => loadingEl.style.display = 'none', 500); }, 400); }
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a3a5c, 0.002);
    scene.background = new THREE.Color(0x0a2040);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const ambient = new THREE.AmbientLight(0x446688, 0.5);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffe0b0, 1.4);
    sun.position.set(80, 150, 40);
    sun.castShadow = true;
    scene.add(sun);
    const oceanGeo = new THREE.PlaneGeometry(1600, 1600, 96, 96);
    const oceanMat = new THREE.MeshPhongMaterial({ color: 0x004488, shininess: 120, specular: 0x4488cc, emissive: 0x001122 });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.rotation.x = -Math.PI / 2;
    scene.add(ocean);
    const origPos = ocean.geometry.attributes.position.array.slice();
    function createBoat(color = 0x111111, accent = 0xcc0000) {
      const g = new THREE.Group();
      const hull = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1, 10), new THREE.MeshPhongMaterial({ color, shininess: 40 }));
      hull.position.y = 0.5; g.add(hull);
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.25, 10.1), new THREE.MeshPhongMaterial({ color: accent }));
      stripe.position.y = 0.15; g.add(stripe);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.3, 3.5), new THREE.MeshPhongMaterial({ color: 0x222222 }));
      cabin.position.set(0, 1.5, -0.8); g.add(cabin);
      for (let i = 0; i < 4; i++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1, 1.3), new THREE.MeshPhongMaterial({ color: 0x333333 }));
        m.position.set(-1.05 + i * 0.7, 0.1, 4.8); g.add(m);
      }
      return g;
    }
    const boat = createBoat();
    boat.position.y = 1; scene.add(boat);
    const enemies = [];
    function spawnEnemy() {
      const e = createBoat(0x222244, 0xff4400);
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 60;
      e.position.set(Math.cos(angle) * dist, 1, Math.sin(angle) * dist);
      e.userData = { speed: 25 + Math.random() * 20, health: 100, heading: Math.random() * Math.PI * 2, lastShot: 0 };
      scene.add(e); enemies.push(e);
    }
    for (let i = 0; i < 4; i++) spawnEnemy();
    function addRock(x, z, s = 1) {
      const mat = new THREE.MeshPhongMaterial({ color: 0x555566, flatShading: true });
      const rock = new THREE.Mesh(new THREE.ConeGeometry(6 * s, 16 * s, 7), mat);
      rock.position.set(x, 6 * s, z); scene.add(rock);
      if (s > 1.3) {
        const arch = new THREE.Mesh(new THREE.TorusGeometry(5 * s, 1.5, 6, 10, Math.PI), mat);
        arch.position.set(x, 5, z); arch.rotation.x = Math.PI / 2; scene.add(arch);
      }
    }
    addRock(50, -40, 1.8); addRock(-60, 30, 2.1); addRock(90, 70, 1.6); addRock(-20, -90, 1.4); addRock(20, 110, 2.3);
    const projectiles = [];
    const projGeo = new THREE.SphereGeometry(0.3, 6, 6);
    const projMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    function shoot(from, dir, isPlayer = false) {
      const p = new THREE.Mesh(projGeo, projMat);
      p.position.copy(from.position).add(new THREE.Vector3(0, 1, 0));
      p.userData = { vel: dir.clone().normalize().multiplyScalar(80), life: 3, isPlayer };
      scene.add(p); projectiles.push(p);
    }
    let playerHealth = 100, kills = 0, speed = 0, heading = 0, throttle = 0, steer = 0, boost = false, lastPlayerShot = 0;
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
    window.addEventListener('keyup', e => keys[e.code] = false);
    const joystick = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    let joyActive = false, joyX = 0, joyY = 0;
    function setStick(x, y) {
      const max = 35;
      const dx = Math.max(-max, Math.min(max, x));
      const dy = Math.max(-max, Math.min(max, y));
      stick.style.transform = `translate(${dx}px, ${dy}px)`;
      joyX = dx / max; joyY = -dy / max;
    }
    joystick.addEventListener('touchstart', e => { joyActive = true; e.preventDefault(); });
    joystick.addEventListener('touchmove', e => {
      if (!joyActive) return;
      const rect = joystick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      setStick(e.touches[0].clientX - cx, e.touches[0].clientY - cy);
      e.preventDefault();
    });
    joystick.addEventListener('touchend', () => { joyActive = false; setStick(0, 0); });
    const shootBtn = document.getElementById('shoot-btn');
    let shootHeld = false;
    shootBtn.addEventListener('touchstart', e => { shootHeld = true; e.preventDefault(); });
    shootBtn.addEventListener('touchend', () => shootHeld = false);
    function updateInput() {
      throttle = 0; steer = 0; boost = keys['Space'] || false;
      if (keys['KeyW'] || keys['ArrowUp']) throttle = 1;
      if (keys['KeyS'] || keys['ArrowDown']) throttle = -0.4;
      if (keys['KeyA'] || keys['ArrowLeft']) steer = 1;
      if (keys['KeyD'] || keys['ArrowRight']) steer = -1;
      if (joyActive) { throttle = Math.max(0, joyY); steer = -joyX; if (joyY < -0.3) throttle = joyY * 0.5; }
    }
    const hud = document.getElementById('hud');
    const healthFill = document.getElementById('health-fill');
    const scoreEl = document.getElementById('score');
    function takeDamage(amount) {
      playerHealth = Math.max(0, playerHealth - amount);
      healthFill.style.width = playerHealth + '%';
      healthFill.style.background = playerHealth > 50 ? '#0f0' : playerHealth > 25 ? '#ff0' : '#f00';
      if (playerHealth <= 0) gameOver();
    }
    function gameOver() {
      document.getElementById('final-score').textContent = `Kills: ${kills}`;
      document.getElementById('game-over').style.display = 'flex';
    }
    document.getElementById('restart').onclick = () => location.reload();
    function animate() {
      requestAnimationFrame(animate);
      const t = performance.now() * 0.001;
      const dt = 0.016;
      const pos = ocean.geometry.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3) {
        const x = origPos[i]; const z = origPos[i + 2];
        pos[i + 1] = Math.sin(x * 0.015 + t * 1.2) * 1.2 + Math.cos(z * 0.012 + t * 0.9) * 0.9 + Math.sin((x + z) * 0.008 + t * 1.5) * 0.6;
      }
      ocean.geometry.attributes.position.needsUpdate = true;
      ocean.geometry.computeVertexNormals();
      updateInput();
      const accel = throttle * 55 * (boost ? 1.7 : 1);
      speed += accel * dt; speed *= 0.975; speed = Math.max(-20, Math.min(90, speed));
      const turn = steer * (0.4 + Math.abs(speed) / 90 * 1.2);
      heading += turn * dt;
      boat.rotation.y = heading;
      const move = speed * dt * 0.8;
      boat.position.x += Math.sin(heading) * move;
      boat.position.z += Math.cos(heading) * move;
      const wh = Math.sin(boat.position.x * 0.015 + t * 1.2) * 1.2 + Math.cos(boat.position.z * 0.012 + t * 0.9) * 0.9;
      boat.position.y = 1 + wh * 0.45;
      boat.rotation.x = Math.sin(t * 3 + speed * 0.05) * 0.04 * Math.abs(speed) / 50;
      boat.rotation.z = -steer * 0.25 * Math.abs(speed) / 60;
      const offset = new THREE.Vector3(0, 5.5, -12);
      offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), heading);
      camera.position.lerp(boat.position.clone().add(offset), 0.1);
      camera.lookAt(boat.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
      const now = performance.now();
      if ((keys['Space'] || shootHeld) && now - lastPlayerShot > 280) {
        const dir = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
        shoot(boat, dir, true); lastPlayerShot = now;
      }
      enemies.forEach((e, idx) => {
        const toPlayer = boat.position.clone().sub(e.position);
        const dist = toPlayer.length();
        if (dist > 15) e.userData.heading = Math.atan2(toPlayer.x, toPlayer.z);
        e.rotation.y = e.userData.heading;
        const em = e.userData.speed * dt * 0.5;
        e.position.x += Math.sin(e.userData.heading) * em;
        e.position.z += Math.cos(e.userData.heading) * em;
        e.position.y = 1 + Math.sin(e.position.x * 0.015 + t) * 0.8 * 0.4;
        if (dist < 50 && now - e.userData.lastShot > 1200) {
          shoot(e, toPlayer.normalize(), false); e.userData.lastShot = now;
        }
        if (dist > 200) { scene.remove(e); enemies.splice(idx, 1); spawnEnemy(); }
      });
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.position.add(p.userData.vel.clone().multiplyScalar(dt));
        p.userData.life -= dt;
        if (p.userData.life <= 0) { scene.remove(p); projectiles.splice(i, 1); continue; }
        if (p.userData.isPlayer) {
          enemies.forEach((e, ei) => {
            if (p.position.distanceTo(e.position) < 3) {
              e.userData.health -= 35; scene.remove(p); projectiles.splice(i, 1);
              if (e.userData.health <= 0) { scene.remove(e); enemies.splice(ei, 1); kills++; scoreEl.textContent = `Kills: ${kills}`; spawnEnemy(); }
            }
          });
        } else if (p.position.distanceTo(boat.position) < 2.5) { takeDamage(12); scene.remove(p); projectiles.splice(i, 1); }
      }
      hud.textContent = `Speed: ${Math.abs(speed * 1.15).toFixed(0)} KM/H${boost ? ' BOOST' : ''}`;
      renderer.render(scene, camera);
    }
    setTimeout(() => { hideLoading(); animate(); }, 2200);
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
